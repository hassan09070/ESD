# fixit — agentic coding CLI + FastAPI agent server with full observability.
# Managed with uv: `uv sync` creates .venv, `uv run pytest` runs the tests,
# `uv run fixit --help` runs the CLI. The agent container installs the same
# package with pip (see agent/Dockerfile).
[project]
name = "fixit"
version = "0.1.0"
description = "A small agentic coding tool instrumented with Prometheus metrics and structured logs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "anthropic>=0.40",
    "pytest>=8.0",          # needed at runtime: the sandbox runs pytest on the target repo
    "pydantic>=2.0",
]

[project.scripts]
fixit = "cli.fixit:app"

[dependency-groups]
dev = ["pytest>=8.0", "requests>=2.31"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
