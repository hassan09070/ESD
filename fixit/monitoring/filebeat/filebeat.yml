# Filebeat: ship the agent container's JSON stdout to Elasticsearch.
#
# Why autodiscover (docker provider) rather than a plain `container` input on
# /var/lib/docker/containers/*/*.log: autodiscover watches the Docker API, so it only
# tails the container named fixit-agent (not Prometheus/Grafana/ES noise), and it
# follows the container across restarts/re-creations when the container ID changes.
# Both /var/lib/docker/containers (the json-file log files) and /var/run/docker.sock
# (container metadata) are mounted read-only from the Docker host.
#
# Pipeline per line:
#   docker json-file wrapper {"log": "<our JSON>\n", "stream": "stdout", "time": ...}
#   -> filestream + container parser  : unwraps the wrapper into `message`
#   -> decode_json_fields             : parses `message` into top-level fields (event, run_id, ...)
#   -> timestamp                      : @timestamp := our `ts` (when the app wrote the line)
#   -> drop_fields                    : remove noisy beat/docker fields
#   -> Elasticsearch index fixit-logs-YYYY.MM.DD (mapping + ILM from scripts/setup_elastic.sh)

filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: false
      templates:
        - condition:
            contains:
              docker.container.name: fixit-agent
          config:
            - type: filestream
              id: fixit-agent-${data.docker.container.id}
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              parsers:
                - container:
                    stream: all
                    format: docker
              prospector.scanner.symlinks: true
              close.on_state_change.inactive: 5m

processors:
  - add_docker_metadata:
      host: unix:///var/run/docker.sock
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: true
      max_depth: 2
  - timestamp:
      field: ts
      layouts:
        - "2006-01-02T15:04:05.999999Z"
        - "2006-01-02T15:04:05.999Z"
        - "2006-01-02T15:04:05Z"
      timezone: UTC
      ignore_missing: true
      ignore_failure: true
  - drop_fields:
      fields: ["agent", "ecs", "input", "log", "host", "docker", "container.labels", "container.image"]
      ignore_missing: true

# We manage the index template + ILM policy ourselves (scripts/setup_elastic.sh) so that
# Filebeat's ECS template (which maps `event` as an object) never collides with our
# string `event` field.
setup.template.enabled: false
setup.ilm.enabled: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "fixit-logs-%{+yyyy.MM.dd}"
  # Filebeat requires these when a custom index name is used
setup.template.name: "fixit-logs"
setup.template.pattern: "fixit-logs-*"

logging.level: info
logging.to_stderr: true
logging.metrics.enabled: false
