# Prometheus scrape config for termlab.
# Three jobs: the api (app + business metrics at :8000/metrics), node-exporter (machine
# metrics) and Prometheus itself (needed for prometheus_tsdb_head_series in Part E.2).
# scrape_interval 5s => a 2-minute experiment stage yields >= 24 samples per series.
# Retention is set on the command line in docker-compose.yml (--storage.tsdb.retention.time=7d).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
        labels: {service: termlab-api}

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
