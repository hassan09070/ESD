# termlab — browser terminal sandboxes on hardened Docker containers, with full observability.
# Managed with uv: `uv sync` creates .venv, `uv run pytest` runs the tests,
# `uv run uvicorn api.main:app` runs the control plane on the host. The api container
# installs the same package with pip (see api/Dockerfile).
[project]
name = "termlab"
version = "0.1.0"
description = "Multi-tenant browser terminal sandboxes instrumented with Prometheus metrics and structured logs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "docker>=7.1",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "websockets>=13",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
