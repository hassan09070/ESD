# Linux-host override for Node Exporter: mount the real host / so disk and filesystem
# panels are the physical machine's (pid/uts/network are already the host's in the base file).
#   docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d
services:
  node-exporter:
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
