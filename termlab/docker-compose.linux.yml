# Linux-host override for Node Exporter: expose the real host /proc, /sys and / so CPU,
# memory, disk and network are the physical machine's, not the container's.
#   docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d
services:
  node-exporter:
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
