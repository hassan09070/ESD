# canteen stack: the app, Prometheus, Grafana, Node Exporter.
services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: canteen-app
    environment:
      CANTEEN_DEMO_CARDINALITY: ${CANTEEN_DEMO_CARDINALITY:-0}   # Part E.2 toggle; re-create the app to apply
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: canteen-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus            # the TSDB survives `docker compose down`, not `down -v`
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:12.1.0
    container_name: canteen-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana          # users/prefs only; dashboards come from the files above
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prom_data:
  grafana_data:
