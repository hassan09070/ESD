# canteen stack (Assignment 3): three identical application replicas A, B, C behind Envoy
# + metrics (Prometheus, Grafana, Node Exporter) + logs (Filebeat, Elasticsearch, Kibana) + a
# one-shot `setup` job that installs the ILM policy, the index template and the Kibana data
# view before Filebeat ships the first line.
#
#   HTTP / gRPC clients --> envoy :8000 (HTTP) / :50051 (gRPC) --> app-a | app-b | app-c  (:8000 HTTP + :50051 gRPC each)
#                                                                   \___ one SQLite file on app_data ___/
#
# Each replica is one process (app/replica.py) serving both interfaces, with CANTEEN_REPLICA
# set to A, B or C and a fixed IP (Envoy's clusters are STATIC: only its active health checks
# decide membership, see envoy/render.py). The replicas are also published directly on
# 8001/8002/8003 so a fault can be set on one of them (PUT /chaos) and Prometheus scrapes
# them by name, never through Envoy. ENVOY_MODE picks the balancing config
# (a_only | round_robin | weighted | least_request); scripts/envoy_mode.sh switches it.
#
# Named volumes survive `docker compose down` but not `down -v`: app_data (the SQLite store,
# shared by the three replicas), prom_data (TSDB, 7 d retention), grafana_data (users/prefs),
# es_data (indices, deleted by ILM after 7 d), filebeat_registry (read offsets, so a Filebeat
# restart does not re-ship old lines). Containers' raw stdout is kept by Docker's json-file
# driver (3 x 10 MB) and removed with the container.

# One definition for the three replicas; only CANTEEN_REPLICA, the name, the host port and the IP differ.
# app-a builds the image (app/Dockerfile); app-b and app-c run the same image, never pulled.
x-replica: &replica
  image: canteen-app:a3
  pull_policy: never
  volumes:
    - app_data:/data
  logging:
    driver: json-file            # the file Filebeat reads: /var/lib/docker/containers/<id>/<id>-json.log
    options:
      max-size: "10m"
      max-file: "3"

x-replica-env: &replica-env
  CANTEEN_DB: /data/canteen.db                                 # the store shared by all replicas (orders + idempotency keys)
  CANTEEN_DEMO_CARDINALITY: ${CANTEEN_DEMO_CARDINALITY:-0}   # A1 Part E.2 toggle; re-create the replicas to apply
  GRPC_PORT: "50051"

services:
  app-a:
    <<: *replica
    build:
      context: .
      dockerfile: app/Dockerfile
    pull_policy: build
    container_name: canteen-app-a
    environment:
      <<: *replica-env
      CANTEEN_REPLICA: A
    ports:
      - "8001:8000"              # direct access to A (chaos, inspection); clients use Envoy on 8000
    networks:
      default:
        ipv4_address: 172.28.0.11

  app-b:
    <<: *replica
    container_name: canteen-app-b
    environment:
      <<: *replica-env
      CANTEEN_REPLICA: B
    ports:
      - "8002:8000"
    networks:
      default:
        ipv4_address: 172.28.0.12

  app-c:
    <<: *replica
    container_name: canteen-app-c
    environment:
      <<: *replica-env
      CANTEEN_REPLICA: C
    ports:
      - "8003:8000"
    networks:
      default:
        ipv4_address: 172.28.0.13

  # A3: the load balancer. 8000 -> listener 10000 (HTTP/1.1), 50051 -> listener 10001 (HTTP/2,
  # gRPC), 9901 = admin (stats, clusters, health). Config files are generated by envoy/render.py.
  envoy:
    image: envoyproxy/envoy:v1.33.0
    container_name: canteen-envoy
    command: ["envoy", "-c", "/etc/envoy/${ENVOY_MODE:-round_robin}.yaml", "--log-level", "warn", "--service-node", "canteen-envoy", "--service-cluster", "canteen"]
    volumes:
      - ./envoy:/etc/envoy:ro
    ports:
      - "8000:10000"
      - "50051:10001"
      - "9901:9901"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
      app-c:
        condition: service_healthy

  # Continuous, realistic random traffic so the dashboards and Kibana are never empty.
  # `docker compose stop load` pauses it (the experiment runner does this itself).
  load:
    image: python:3.12-slim
    container_name: canteen-load
    command: ["python3", "/scripts/load.py", "--forever"]
    volumes:
      - ./scripts/load.py:/scripts/load.py:ro
    environment:
      CANTEEN_URL: http://envoy:10000     # A3: through the load balancer, like every other client
      LOAD_CUSTOMERS: "6"          # customers in flight; think time between orders follows the busy/quiet cycle
      LOAD_PERIOD_MIN: "20"        # minutes per busy/quiet cycle, plus random rushes and lulls
    depends_on:
      - envoy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: canteen-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus            # the TSDB survives `docker compose down`, not `down -v`
    ports:
      - "9090:9090"
    extra_hosts:
      - "node-exporter:172.17.0.1"      # docker0 gateway = the host/VM as seen from a bridge network
    depends_on:
      - app-a
      - app-b
      - app-c
      - envoy
      - node-exporter

  # Node Exporter reports the kernel it runs on. pid/uts/network namespaces are the host's
  # so processes, hostname and network interfaces are the machine's, not this container's.
  # On Docker Desktop (Mac) "the machine" is the Docker Linux VM: nodename=docker-desktop.
  # A host-network container has no compose DNS name, so Prometheus reaches it through the
  # docker0 gateway (extra_hosts on the prometheus service); port 9100 is not published.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: canteen-node-exporter
    pid: host
    uts: host
    network_mode: host
    command:
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      # default list minus "overlay" so the container's / (the VM disk) is reported
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$$

  grafana:
    image: grafana/grafana:12.1.0
    container_name: canteen-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana          # users/prefs only; dashboards come from the files above
    ports:
      - "${GRAFANA_PORT:-3000}:3000"     # GRAFANA_PORT=3001 if something else holds 3000
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    container_name: canteen-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # local classroom stack only; never expose 9200 like this
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms768m -Xmx768m"
      cluster.routing.allocation.disk.threshold_enabled: "false"
    deploy:
      resources:
        limits:
          memory: 1500m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.0
    container_name: canteen-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_ENABLED: "false"
      XPACK_SECURITY_ENCRYPTIONKEY: canteen-local-only-key-not-for-production-use
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: canteen-local-only-key-not-for-production-use
      XPACK_REPORTING_ENCRYPTIONKEY: canteen-local-only-key-not-for-production-use
    deploy:
      resources:
        limits:
          memory: 1g
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  # One-shot: ILM policy + index template + Kibana data view (scripts/setup_elastic.sh). Exits 0.
  setup:
    image: curlimages/curl:8.14.1
    container_name: canteen-setup
    entrypoint: ["/bin/sh", "/setup/setup_elastic.sh"]
    environment:
      ES_URL: http://elasticsearch:9200
      KIBANA_URL: http://kibana:5601
      ILM_POLICY_FILE: /setup/ilm_policy.json
      INDEX_TEMPLATE_FILE: /setup/index_template.json
    volumes:
      - ./scripts/setup_elastic.sh:/setup/setup_elastic.sh:ro
      - ./monitoring/elasticsearch/ilm_policy.json:/setup/ilm_policy.json:ro
      - ./monitoring/elasticsearch/index_template.json:/setup/index_template.json:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_started

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.18.0
    container_name: canteen-filebeat
    user: root                          # needs to read /var/lib/docker/containers and the socket
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro   # the json-file logs
      - /var/run/docker.sock:/var/run/docker.sock:ro               # container names for autodiscover
      - filebeat_registry:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

networks:
  default:                             # the compose network, with a known subnet so the replicas can have fixed IPs
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  app_data:                            # the SQLite store (orders, idempotency keys), shared by the three replicas
  prom_data:
  grafana_data:
  es_data:
  filebeat_registry:
