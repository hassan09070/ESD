# canteen — a university canteen order queue, built to learn Prometheus/Grafana/Node Exporter
# and Filebeat/Elasticsearch/Kibana (ESD Assignment 1).
#
# Managed with uv:  uv sync  ->  uv run uvicorn app.main:app --reload  ->  uv run pytest
[project]
name = "canteen"
version = "0.1.0"
description = "University canteen order queue with metrics and structured logs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "grpcio>=1.60",
    "protobuf>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",      # fastapi.testclient needs it
    "grpcio-tools>=1.60",
    "jsonschema>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "grpc_service"]
